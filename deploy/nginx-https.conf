server {
    listen 80;
    server_name www.dyw2.xyz dyw2.xyz;
    root /var/www/wayne-portfolio/current;
    location /.well-known/acme-challenge/ { try_files $uri =404; }
    location / { return 301 https://www.dyw2.xyz$request_uri; }
}
server {
    listen 443 ssl;
    server_name dyw2.xyz;
    ssl_certificate /etc/letsencrypt/live/www.dyw2.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.dyw2.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://www.dyw2.xyz$request_uri;
}
server {
    listen 443 ssl;
    server_name www.dyw2.xyz;
    root /var/www/wayne-portfolio/current;
    index index.html;
    charset utf-8;
    ssl_certificate /etc/letsencrypt/live/www.dyw2.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.dyw2.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    gzip_types text/css application/javascript application/json image/svg+xml;
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location /data/ {
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }
    location ~ /\.(?!well-known) { deny all; }
    location / {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;
}
